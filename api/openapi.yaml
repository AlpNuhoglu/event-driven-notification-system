openapi: 3.0.3
info:
  title: Event-driven notification system
  version: 0.1.0
  description: |
    Creates notifications and reports their delivery state. Delivery is
    asynchronous: a `202` acknowledges acceptance, not delivery.

    This version of the contract has the single and the batch create with
    idempotency keys and `dedupe_key`, the reads (by id, the attempts, a
    batch, the filtered list), cancel (one notification or a batch) and
    redrive, the management of templates, the preview of a template and
    notifications created from a template. Scheduling is added in a later
    version.

    **States.** `cancelled` and `failed` are not strictly final: a
    notification in either state becomes `sent` when a late result proves
    that the provider accepted it.

    **Errors.** Every non-2xx answer is an RFC 9457 problem
    (`application/problem+json`, schema `Problem`), including the answers to
    a path that does not exist (`404`) and to a method that a path does not
    support (`405`, with an `Allow` header). These two can be returned for
    any request and are therefore not repeated under each operation.

    **Correlation.** A request may carry `X-Request-ID`: it is accepted when
    it is at most 128 characters of `[A-Za-z0-9._-]`, otherwise it is
    ignored and a new id is generated. Every response carries the id in
    `X-Request-ID`; every problem carries it in `correlation_id`.

    **Body size.** Every endpoint limits the request body to `MAX_BODY_BYTES`
    (5 MB by default); a larger body is answered with `413`.
tags:
  - name: notifications
  - name: templates
  - name: metrics
  - name: health
  - name: meta
paths:
  /v1/notifications:
    post:
      operationId: createNotification
      tags: [notifications]
      summary: Create a notification
      description: |
        Accepts one notification for delivery. The response is the stored
        notification in state `pending`. The content is stored and sent but
        not returned. A field that this version does not define is rejected
        with `422` and code `unknown_field`, never ignored.

        The message is given either as `content` or as `template`. A template
        is rendered when the notification is created: the rendered text is
        validated like a `content` of the channel and stored, and `template`
        in the response names the version that produced it. Rendering errors
        are answered `422` (`template.variables.<name>`, `template.name`,
        `template.version`, `template`). A retry with the same
        `Idempotency-Key` and the same body returns the stored answer even if
        the template was changed or deactivated since.

        A notification can be scheduled for later delivery with
        `scheduled_at`: it stays `pending` until that time and is delivered
        then, not before (to about 100 ms). A `scheduled_at` up to 30
        seconds in the past means "now": it is stored and answered as
        `null`. Older values (`in_the_past`) and values more than 30 days
        ahead (`too_far_ahead`) are refused. An explicit `expires_at` must be
        at least 30 seconds after the due time (`too_soon`). A scheduled
        notification can be cancelled until a worker takes it; it cannot be
        rescheduled.
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "202":
          description: Accepted for delivery.
          headers:
            Location:
              description: The path of the created notification.
              required: true
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Duplicate"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      description: |
        Newest first (`created_at` descending, then `id` descending), with a
        keyset cursor. Every filter takes a single value. There is no total
        count. A parameter this version does not define, a parameter given
        more than once and an invalid value are rejected with `400`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Status"
        - name: channel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Channel"
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Priority"
        - name: batch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            x-go-type: string
        - name: created_from
          in: query
          required: false
          description: Inclusive lower bound of `created_at` (RFC 3339 with an offset).
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          required: false
          description: Exclusive upper bound of `created_at` (RFC 3339 with an offset).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page, unchanged. Opaque.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: One page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notifications/{id}:
    get:
      operationId: getNotification
      tags: [notifications]
      summary: Read a notification
      parameters:
        - name: id
          in: path
          required: true
          description: The notification id.
          schema:
            type: string
            format: uuid
            x-go-type: string
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The notification.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notifications/{id}/attempts:
    get:
      operationId: listNotificationAttempts
      tags: [notifications]
      summary: Read the delivery attempts of a notification
      parameters:
        - $ref: "#/components/parameters/NotificationID"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The attempts in the order they were made.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notifications/{id}/cancel:
    post:
      operationId: cancelNotification
      tags: [notifications]
      summary: Cancel a notification
      description: |
        Allowed while no worker holds the notification: from `pending`,
        `queued` and `retrying`. Cancelling a notification that is already
        `cancelled` answers `200` again. From `processing`, `sent` or `failed`
        the answer is `409` with `current_status`. The request has no body.

        `may_have_been_sent` is `true` when an earlier attempt ended without
        a known result: the cancel stops further attempts, but one delivery
        may already have reached the recipient, and the notification can
        still become `sent` if the result arrives.
      parameters:
        - $ref: "#/components/parameters/NotificationID"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The notification is cancelled.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notifications/{id}/redrive:
    post:
      operationId: redriveNotification
      tags: [notifications]
      summary: Send a failed notification again
      description: |
        Allowed only from `failed`: the notification becomes `pending` with a
        new retry budget and is due at once. The attempt history continues;
        `attempt_count` is never reset. If the stored `expires_at` is still in
        the future it is kept, and the request must not carry one. If it has
        passed, the request must carry a new `expires_at`. The body is
        optional; when present it is a JSON object.
      parameters:
        - $ref: "#/components/parameters/NotificationID"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedriveRequest"
      responses:
        "200":
          description: The notification is `pending` again.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/notifications/batch:
    post:
      operationId: createNotificationBatch
      tags: [notifications]
      summary: Create a batch of notifications
      description: |
        Accepts up to 1,000 notifications in one request. Every item is
        validated on its own: the valid ones are stored, the invalid ones are
        listed in `rejected` with their position in the request. The answer is
        `202` when at least one item is stored and `422` (with `rejected`)
        when none is. An item may use `template`; an item whose template
        cannot be rendered is rejected with its errors and the others go on.
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
      responses:
        "202":
          description: At least one item is accepted for delivery.
          headers:
            Location:
              description: The path of the created batch (`/v1/batches/{batch_id}`).
              required: true
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/batches/{id}:
    get:
      operationId: getBatch
      tags: [notifications]
      summary: Read a batch
      parameters:
        - name: id
          in: path
          required: true
          description: The batch id.
          schema:
            type: string
            format: uuid
            x-go-type: string
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The batch with the count of its notifications per status.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/batches/{id}/cancel:
    post:
      operationId: cancelBatch
      tags: [notifications]
      summary: Cancel the notifications of a batch
      description: |
        Cancels every notification of the batch that no worker holds
        (`pending`, `queued`, `retrying`). The counts describe the batch after
        the call, so the call can be repeated: a second call cancels what has
        become cancellable since (a notification a worker held that returned
        to `retrying`) and otherwise gives the same answer. The request has no
        body.
      parameters:
        - $ref: "#/components/parameters/BatchID"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The counts of the batch after the call.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCancelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/metrics/summary:
    get:
      operationId: getMetricsSummary
      tags: [metrics]
      summary: Delivery metrics of the last few minutes
      description: |
        The state of the nine lanes and, per channel, the delivery attempts
        that finished within the window (`SUMMARY_WINDOW`), computed from
        Postgres. The answer is cached for `SUMMARY_CACHE_TTL`, and the
        `backlog_due` of the lanes for `SUMMARY_BACKLOG_CACHE_TTL`;
        `generated_at` tells when it was computed.
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The summary.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      description: Answers `200` while the process serves. It checks no dependency.
      responses:
        "200":
          description: The process is serving.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      description: |
        Answers `200` when Postgres answers a ping, otherwise `503`. Both
        answers list each dependency check with its status and duration; the
        `503` is a problem document that carries them in `checks`.
      responses:
        "200":
          description: Every dependency answers.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [meta]
      summary: This specification
      description: The OpenAPI document the server was generated from.
      responses:
        "200":
          description: The specification in YAML.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/yaml: {}
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List templates
      description: |
        By `name`, ascending, in ASCII order (`-`, digits, `_`, letters), with
        a keyset cursor. Inactive templates are listed too. Each item is a
        summary; the body of a template is read with `GET /v1/templates/{name}`.
        There is no total count. A parameter this version does not define, a
        parameter given more than once and an invalid value are rejected with
        `400`. A template created while a client pages appears if its name
        sorts after the cursor, and never otherwise.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page, unchanged. Opaque.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: One page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a template
      description: |
        Creates the template with its version 1. The `channel` is fixed for
        the life of the template. The body is compiled for the channel when it
        is created: a source or a declaration the engine refuses is answered
        with `422`, one error for the first problem found (the code is listed
        in `docs/errors.md`). A name that exists answers `409`; new content
        for an existing name goes through `POST /v1/templates/{name}/versions`.

        **What a template may contain.** Text, `{{ .name }}` (one level, no
        chained fields), `if` / `else`, string literals, and the two functions
        `default` and `truncate`: `{{ .first_name | default "Customer" }}`,
        `{{ .text | truncate 50 }}`. Everything else of Go's template language
        is refused. Every variable used must be declared in `variables`
        (required) or `optional_variables`, and every declared variable must
        be used.

        **Behaviour of the engine an author will meet.**

        1. Every variable reaches the template as a string, and
           `{{ if .flag }}` tests whether that string is empty. The JSON value
           `false` is the empty string, so `false`, `""` and an optional
           variable that is left out all take the `else` branch; `true` is
           the text `true`. It follows that `{{ .flag }}` prints nothing for
           `false`, and that `default` applies to a `false` value
           (`{{ .flag | default "off" }}` prints `off`). A number keeps its
           text: `0` is the text `0`, which is not empty and takes the `if`
           branch, and so does the string `"false"`.
        2. An e-mail body must be HTML that ends in plain text context: a body
           that ends inside a tag, an attribute, a comment or a `<script>` is
           refused (`unsafe_html`).
        3. HTML comments in an e-mail body are removed from the output.
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: The template is created; the body shows its version 1.
          headers:
            Location:
              description: The path of the created template.
              required: true
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/TemplateExists"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/templates/{name}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a template
      description: The template with its latest version.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The template with its latest version.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/templates/{name}/versions:
    post:
      operationId: createTemplateVersion
      tags: [templates]
      summary: Add a version to a template
      description: |
        Adds the next version. Versions are immutable: this never changes an
        earlier one. The body is compiled for the template's channel, with the
        same rules and the same `422` answers as `POST /v1/templates`. An
        inactive template can receive a version.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateVersionRequest"
      responses:
        "201":
          description: The version is created; the body shows it.
          headers:
            Location:
              description: The path of the created version.
              required: true
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/templates/{name}/versions/{version}:
    get:
      operationId: getTemplateVersion
      tags: [templates]
      summary: Get one version of a template
      description: |
        The template as it is now (`is_active`, `latest_version`) with the
        requested version, which never changes.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/TemplateVersion"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The template with the requested version.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/templates/{name}/preview:
    post:
      operationId: previewTemplate
      tags: [templates]
      summary: Render a template without storing anything
      description: |
        A dry run: renders the template (the latest version, or `version`)
        with `variables` for the template's own channel and returns the text
        a notification would store, with its SMS encoding and segment count.
        Nothing is stored. The answers are those of a create from the
        template, with the field names `variables.<name>`, `version` and
        `content` (the rendered text); unlike a create, an inactive template
        can be previewed. An unknown name or version answers `404`. The body
        is optional; when present it is a JSON object.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePreviewRequest"
      responses:
        "200":
          description: The rendered text.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/templates/{name}/deactivate:
    post:
      operationId: deactivateTemplate
      tags: [templates]
      summary: Deactivate a template
      description: |
        No new notification can use an inactive template. Existing
        notifications are not affected. Deactivating an inactive template
        answers `200` again. The request has no body.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The template is inactive; the body shows its latest version.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/templates/{name}/activate:
    post:
      operationId: activateTemplate
      tags: [templates]
      summary: Reactivate a template
      description: |
        Reverses a deactivation. Activating an active template answers `200`
        again. The request has no body.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/TraceParent"
      responses:
        "200":
          description: The template is active; the body shows its latest version.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  parameters:
    NotificationID:
      name: id
      in: path
      required: true
      description: The notification id.
      schema:
        type: string
        format: uuid
        x-go-type: string
    BatchID:
      name: id
      in: path
      required: true
      description: The batch id.
      schema:
        type: string
        format: uuid
        x-go-type: string
    TemplateName:
      name: name
      in: path
      required: true
      description: The template name.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    TemplateVersion:
      name: version
      in: path
      required: true
      description: The version number, an integer from 1.
      schema:
        type: integer
        format: int32
        minimum: 1
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Correlation id. Accepted when it is at most 128 characters of
        `[A-Za-z0-9._-]`; otherwise it is ignored and a new id is generated.
        An invalid value is not an error.
      schema:
        type: string
    TraceParent:
      name: traceparent
      in: header
      required: false
      description: |
        W3C Trace Context. Stored with the notification when it is well
        formed; otherwise ignored. An invalid value is not an error.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes the request safe to retry: 1 to 255 characters, each in the
        range U+0021 to U+007E. A retry with the same key and the same request
        returns the stored answer. The header must be sent at most once.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[\\x21-\\x7E]+$"
  headers:
    IdempotentReplayed:
      description: |
        Present with the value `true` only when the answer is the stored answer
        of an earlier request with the same `Idempotency-Key`.
      required: false
      schema:
        type: boolean
    XRequestID:
      description: The correlation id of the request (the accepted `X-Request-ID` or a generated one).
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request (body that is not a JSON object, path parameter that is not a UUID or, for a template version, not a positive integer).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        The notification's state does not allow the operation; `current_status`
        is the state it is in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Duplicate:
      description: A notification with this `dedupe_key` already exists; `errors` carries the id of the existing one.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |
        No notification, batch, template or template version matches the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body is larger than `MAX_BODY_BYTES`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TemplateExists:
      description: A template with this name already exists; `errors` has the code `template_exists`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: One or more fields are invalid; every invalid field is listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: An unexpected error. The detail never contains the cause.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: Postgres is unavailable. The request can be retried.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
    Status:
      type: string
      description: |
        `sent` is final. `cancelled` and `failed` can still become `sent` when
        a late provider result proves that the message was delivered.
      enum: [pending, queued, processing, retrying, sent, failed, cancelled]
    FailureReason:
      type: string
      enum: [provider_rejected, max_failures, max_failures_unknown_outcome, expired, internal_error]
    CreateNotificationRequest:
      type: object
      additionalProperties: false
      description: |
        Exactly one of `content` and `template` is required (`template: null`
        counts as absent).
      required: [channel, recipient]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        recipient:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Depends on the channel: `sms` an E.164 number such as
            `+905551234567` (not normalised: `05551234567` is refused), `email`
            a single address without a display name, `push` a device token of
            1 to 4,096 characters without control characters. Must not
            contain U+0000.
        content:
          type: string
          minLength: 1
          description: |
            The message; required unless `template` is given, and not allowed
            with it. Must not contain U+0000. At most 10 SMS segments for
            `sms` (the encoding and segment count are returned as `sms`),
            100 KiB (102,400 bytes of UTF-8) for `email`, 4 KiB (4,096 bytes)
            for `push`.
        template:
          allOf:
            - $ref: "#/components/schemas/TemplateUse"
          nullable: true
          description: |
            Renders a stored template instead of giving `content`. The rendered
            text must meet the limits of `content` for the channel, and the
            template's channel must be the notification's.
        priority:
          $ref: "#/components/schemas/Priority"
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional: deliver the notification at this time, not before. RFC
            3339 with an explicit offset (`Z` or `+03:00`); stored and
            answered in UTC to the microsecond. `null` counts as absent. A
            value up to 30 seconds in the past (`SCHEDULE_PAST_TOLERANCE`)
            means "now": the notification is due at once and its
            `scheduled_at` is stored and answered as `null`. An older value is
            refused (`in_the_past`), and so is one more than 30 days ahead
            (`SCHEDULE_MAX_HORIZON`, `too_far_ahead`). The API's clock
            judges the value; every item of a batch is judged at the same
            instant.
        expires_at:
          type: string
          format: date-time
          description: |
            Optional: the notification fails as `expired` if it is not sent by
            this time. RFC 3339 with an explicit offset; `null` is not a
            value. It must be at least 30 seconds (`EXPIRES_AT_MIN_LEAD`)
            after the due time: the `scheduled_at` when it is in the future,
            otherwise now (`too_soon`). Without it, the notification expires
            at the due time plus its priority's TTL.
        dedupe_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Optional. A second notification with the same key is refused (`409`)
            while the first holds it. Must not contain U+0000.
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CreateNotificationRequest"
    BatchAccepted:
      type: object
      additionalProperties: false
      required: [batch_id, accepted, rejected]
      properties:
        batch_id:
          type: string
          format: uuid
        accepted:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, id]
            properties:
              index:
                type: integer
                minimum: 0
                description: The item's position in the request's array.
              id:
                type: string
                format: uuid
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedItem"
    RejectedItem:
      type: object
      additionalProperties: false
      required: [index, errors]
      properties:
        index:
          type: integer
          minimum: 0
          description: The item's position in the request's array.
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldError"
    Batch:
      type: object
      additionalProperties: false
      required: [id, total, accepted, rejected, status_counts, created_at]
      properties:
        id:
          type: string
          format: uuid
        total:
          type: integer
          format: int32
          minimum: 0
          description: The number of items in the request.
        accepted:
          type: integer
          format: int32
          minimum: 0
          description: The number of items stored.
        rejected:
          type: integer
          format: int32
          minimum: 0
          description: The number of items rejected.
        status_counts:
          $ref: "#/components/schemas/BatchStatusCounts"
        created_at:
          type: string
          format: date-time
    BatchStatusCounts:
      type: object
      additionalProperties: false
      required: [pending, queued, processing, retrying, sent, failed, cancelled]
      properties:
        pending:
          type: integer
          format: int32
          minimum: 0
        queued:
          type: integer
          format: int32
          minimum: 0
        processing:
          type: integer
          format: int32
          minimum: 0
        retrying:
          type: integer
          format: int32
          minimum: 0
        sent:
          type: integer
          format: int32
          minimum: 0
        failed:
          type: integer
          format: int32
          minimum: 0
        cancelled:
          type: integer
          format: int32
          minimum: 0
    Notification:
      type: object
      additionalProperties: false
      required:
        - id
        - batch_id
        - channel
        - recipient
        - priority
        - status
        - version
        - sms
        - template
        - scheduled_at
        - expires_at
        - attempt_count
        - failure_reason
        - provider_message_id
        - created_at
        - updated_at
        - sent_at
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
          nullable: true
        channel:
          $ref: "#/components/schemas/Channel"
        recipient:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/Status"
        version:
          type: integer
          format: int64
          minimum: 1
          description: Increases with every state change; clients order status events by it.
        sms:
          allOf:
            - $ref: "#/components/schemas/SMSInfo"
          nullable: true
          description: Set for the channel `sms`, `null` for every other channel.
        template:
          allOf:
            - $ref: "#/components/schemas/TemplateProvenance"
          nullable: true
          description: |
            The template version that produced the content, `null` for a
            notification created with `content`. The variables are not
            returned.
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            The time the notification is scheduled for; `null` when it was due
            at creation (no `scheduled_at`, or one within the tolerance).
        expires_at:
          type: string
          format: date-time
        attempt_count:
          type: integer
          format: int32
          minimum: 0
        failure_reason:
          allOf:
            - $ref: "#/components/schemas/FailureReason"
          nullable: true
          description: Set only when the status is `failed`.
        provider_message_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
    SMSInfo:
      type: object
      additionalProperties: false
      required: [encoding, segments]
      description: |
        How the content is sent as SMS, which decides its cost. One character
        outside the GSM-7 alphabet (for example `ş`, `ğ` or `ı`) puts the
        whole message into UCS-2.
      properties:
        encoding:
          type: string
          enum: [GSM-7, UCS-2]
        segments:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
    NotificationList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` to read the next page; `null` on the last page.
    Outcome:
      type: string
      description: |
        The result of one delivery attempt. `in_flight`: not finished.
        `unknown`: the attempt ended without a known result, so the message
        may have been delivered.
      enum: [in_flight, success, retryable, permanent, provider_fatal, throttled, unknown, unreachable, aborted, internal_error]
    Attempt:
      type: object
      additionalProperties: false
      required: [attempt_no, provider, outcome, http_status, latency_ms, error, provider_message_id, started_at, finished_at]
      properties:
        attempt_no:
          type: integer
          format: int32
          minimum: 1
        provider:
          type: string
        outcome:
          $ref: "#/components/schemas/Outcome"
        http_status:
          type: integer
          format: int32
          nullable: true
        latency_ms:
          type: integer
          format: int32
          nullable: true
        error:
          type: string
          nullable: true
          description: What the provider answered, shortened; never the recipient or the content.
        provider_message_id:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: "`null` only while the attempt is `in_flight`."
    AttemptList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
    CancelResult:
      type: object
      additionalProperties: false
      required: [notification, may_have_been_sent]
      properties:
        notification:
          $ref: "#/components/schemas/Notification"
        may_have_been_sent:
          type: boolean
          description: |
            `true` when the notification has an attempt whose outcome is
            `unknown`: one delivery may already have reached the recipient.
    BatchCancelResult:
      type: object
      additionalProperties: false
      required: [cancelled, not_cancellable, may_have_been_sent]
      properties:
        cancelled:
          type: integer
          format: int32
          minimum: 0
          description: Notifications of the batch that are `cancelled` after the call, by this call or an earlier one.
        not_cancellable:
          type: integer
          format: int32
          minimum: 0
          description: Notifications of the batch that are not cancelled after the call, because a worker holds them (`processing`) or they are finished (`sent`, `failed`).
        may_have_been_sent:
          type: integer
          format: int32
          minimum: 0
          description: Cancelled notifications that have an attempt whose outcome is `unknown`.
    RedriveRequest:
      type: object
      additionalProperties: false
      properties:
        expires_at:
          type: string
          format: date-time
          description: |
            Required when the stored `expires_at` has passed, and not allowed
            otherwise. RFC 3339 with an offset, at least 30 seconds ahead.
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, channel, body]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          description: Lower-case letters, digits, `_` and `-`; 1 to 64 characters, not starting with `_` or `-`.
        channel:
          $ref: "#/components/schemas/Channel"
        body:
          type: string
          minLength: 1
          description: The template source, at most 64 KiB (65,536 bytes). Must not contain U+0000.
        variables:
          $ref: "#/components/schemas/TemplateVariables"
        optional_variables:
          $ref: "#/components/schemas/TemplateOptionalVariables"
    CreateTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          description: The template source, at most 64 KiB (65,536 bytes). Must not contain U+0000.
        variables:
          $ref: "#/components/schemas/TemplateVariables"
        optional_variables:
          $ref: "#/components/schemas/TemplateOptionalVariables"
    TemplateVariables:
      type: array
      description: |
        The required variables. Each matches `^[A-Za-z_][A-Za-z0-9_]{0,63}$`;
        at most 50 variables in both lists together; a name appears once.
        Absent means none.
      items:
        type: string
    TemplateOptionalVariables:
      type: array
      description: |
        The optional variables, under the same rules. A missing optional
        variable is rendered as the empty string. Absent means none.
      items:
        type: string
    TemplateUse:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          description: The template to render.
        version:
          type: integer
          format: int32
          minimum: 1
          description: |
            Pins a version. When absent, the latest version is used. An
            inactive template is refused even with a pinned version.
        variables:
          $ref: "#/components/schemas/TemplateValues"
    TemplateValues:
      type: object
      additionalProperties: true
      description: |
        The values of the template's variables, by name. Absent means none.
        A value is a JSON string, number or boolean and is converted to a
        string: a number keeps its digits as sent (`482913` stays `482913`,
        and `0` is the text `0`), `true` is the text `true`, and `false` is
        the empty string, so a template's `{{ if .flag }}` takes its `else`
        branch for `false`. At most 1,024 characters per value after conversion,
        without U+0000. Every required variable must be given and every given
        variable must be declared. How a template uses its variables is
        described under `POST /v1/templates`.
    TemplateProvenance:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int32
          minimum: 1
    TemplatePreviewRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          description: Pins a version. When absent, the latest version is used.
        variables:
          $ref: "#/components/schemas/TemplateValues"
    TemplatePreview:
      type: object
      additionalProperties: false
      required: [content, encoding, segments]
      properties:
        content:
          type: string
          description: The rendered text, as a notification would store it.
        encoding:
          type: string
          enum: [GSM-7, UCS-2]
          nullable: true
          description: The SMS encoding of the content; `null` unless the template's channel is `sms`.
        segments:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          nullable: true
          description: The SMS segments of the content; `null` unless the template's channel is `sms`.
    Template:
      type: object
      additionalProperties: false
      required:
        - name
        - channel
        - is_active
        - latest_version
        - version
        - body
        - variables
        - optional_variables
        - created_at
        - updated_at
        - version_created_at
      properties:
        name:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        is_active:
          type: boolean
        latest_version:
          type: integer
          format: int32
          minimum: 1
        version:
          type: integer
          format: int32
          minimum: 1
          description: The version shown (the latest one, or the one asked for).
        body:
          type: string
          description: The source of the version shown.
        variables:
          type: array
          items:
            type: string
        optional_variables:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the template last changed (a new version, a deactivation or an activation).
        version_created_at:
          type: string
          format: date-time
          description: When the version shown was created.
    TemplateSummary:
      type: object
      additionalProperties: false
      required: [name, channel, latest_version, is_active]
      properties:
        name:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        latest_version:
          type: integer
          format: int32
          minimum: 1
        is_active:
          type: boolean
    TemplateList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSummary"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` to read the next page; `null` on the last page.
    MetricsSummary:
      type: object
      additionalProperties: false
      required: [generated_at, window, lanes, channels]
      properties:
        generated_at:
          type: string
          format: date-time
          description: When the figures were computed (UTC); a cached answer shows an older time.
        window:
          type: string
          example: 5m
          description: The window of the attempt figures, as a duration (`SUMMARY_WINDOW`).
        lanes:
          type: array
          description: All nine lanes, `sms`, `email`, `push` by `high`, `normal`, `low`.
          items:
            $ref: "#/components/schemas/LaneSummary"
        channels:
          type: array
          description: All three channels, in the order `sms`, `email`, `push`.
          items:
            $ref: "#/components/schemas/ChannelSummary"
    LaneSummary:
      type: object
      additionalProperties: false
      required: [channel, priority, queued, hwm, backlog_due]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        priority:
          $ref: "#/components/schemas/Priority"
        queued:
          type: integer
          format: int64
          minimum: 0
          description: Notifications of the lane in state `queued`.
        hwm:
          type: integer
          format: int32
          minimum: 0
          description: The lane's high-water mark (`LANE_HWM_HIGH`, `LANE_HWM_NORMAL`, `LANE_HWM_LOW`).
        backlog_due:
          type: integer
          format: int64
          minimum: 0
          description: Notifications of the lane in `pending` or `retrying` whose due time has passed.
    ChannelSummary:
      type: object
      additionalProperties: false
      required: [channel, attempts, success_rate, provider_latency_ms, end_to_end_latency_ms]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        attempts:
          $ref: "#/components/schemas/AttemptCounts"
        success_rate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            `success` divided by all attempts finished in the window except
            `aborted` (which sent nothing); `null` when there are none.
        provider_latency_ms:
          $ref: "#/components/schemas/Percentiles"
        end_to_end_latency_ms:
          $ref: "#/components/schemas/Percentiles"
    AttemptCounts:
      type: object
      additionalProperties: false
      description: Attempts finished in the window, by outcome; every outcome is listed, also when zero. `in_flight` is not an outcome of a finished attempt.
      required: [success, retryable, permanent, provider_fatal, throttled, unknown, unreachable, aborted, internal_error]
      properties:
        success: {type: integer, format: int64, minimum: 0}
        retryable: {type: integer, format: int64, minimum: 0}
        permanent: {type: integer, format: int64, minimum: 0}
        provider_fatal: {type: integer, format: int64, minimum: 0}
        throttled: {type: integer, format: int64, minimum: 0}
        unknown: {type: integer, format: int64, minimum: 0}
        unreachable: {type: integer, format: int64, minimum: 0}
        aborted: {type: integer, format: int64, minimum: 0}
        internal_error: {type: integer, format: int64, minimum: 0}
    Percentiles:
      type: object
      additionalProperties: false
      description: Milliseconds; both values are `null` when there is nothing to measure in the window.
      required: [p50, p95]
      properties:
        p50:
          type: number
          format: double
          nullable: true
        p95:
          type: number
          format: double
          nullable: true
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
    Check:
      type: object
      additionalProperties: false
      required: [name, status, duration_ms]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, fail]
        duration_ms:
          type: number
          format: double
          minimum: 0
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, detail, correlation_id]
      properties:
        type:
          type: string
          format: uri
          description: A stable URL that documents the problem type.
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Never contains a recipient, message content or an internal cause.
        correlation_id:
          type: string
        errors:
          type: array
          description: |
            The invalid fields (`422`) or the malformed part of the request
            (`400`). At most 50 entries are listed.
          items:
            $ref: "#/components/schemas/FieldError"
        rejected:
          type: array
          description: |
            Only on the `422` of the batch endpoint when every item was
            rejected: one entry per item, never truncated.
          items:
            $ref: "#/components/schemas/RejectedItem"
        expires_at:
          type: string
          format: date-time
          description: |
            Only on the `409` of a redrive that gave an `expires_at` it does
            not need (`expires_at_not_allowed`), the stored `expires_at`,
            which is still in the future and is kept.
        current_status:
          allOf:
            - $ref: "#/components/schemas/Status"
          description: Only on a `409` of cancel and redrive, the state the notification is in.
        checks:
          type: array
          description: |
            Only on the `503` of `/readyz`: each dependency check with its
            status and duration.
          items:
            $ref: "#/components/schemas/Check"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The request field or path parameter; empty when the request body as a whole is concerned.
        code:
          type: string
          description: Stable and machine-readable; listed in docs/errors.md.
        message:
          type: string
          description: For humans. Never contains the submitted value.
        existing_id:
          type: string
          format: uuid
          description: |
            Only with the code `duplicate`: the id of the notification that
            already holds the `dedupe_key`. Absent when that notification
            released the key in the same instant.
