name: Release

# On a pushed version tag (v*): build the image from the Dockerfile and push
# it to ghcr.io/<owner>/event-driven-notification-system, tagged with the
# version (the Git tag, for example v1.0.0) and with the full commit SHA.
# There is no "latest" tag: an image is always named by what it was built
# from. The build is the one docker-compose and CI use: the same Dockerfile,
# so the same Go version and flags, with GIT_SHA as the version every log
# line and span reports. The image is linux/amd64 only.
#
# docker-compose.yml does not use the published image; it builds from source.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/event-driven-notification-system" >> "$GITHUB_ENV"
      - name: Build
        run: |
          docker build \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_REF_NAME" \
            -t "$IMAGE:$GITHUB_SHA" \
            .
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        run: |
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_SHA"
          {
            echo "Published:"
            echo
            echo "- \`$IMAGE:$GITHUB_REF_NAME\`"
            echo "- \`$IMAGE:$GITHUB_SHA\`"
            echo
            echo "Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_REF_NAME")\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
