# The four application roles are scraped on their admin port (8081), which is
# reachable on the Compose network only (ADR-0009 section 8). The alert rule
# for the relay depends on the job name "relay".
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    static_configs:
      - targets: ["api:8081"]

  - job_name: relay
    static_configs:
      - targets: ["relay:8081"]

  - job_name: worker
    static_configs:
      - targets: ["worker:8081"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8081"]

  - job_name: rabbitmq
    # Per-object endpoint; the default /metrics endpoint is aggregated and
    # has no per-queue series.
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]
