# The Prometheus configuration of the per-channel worker layout
# (docker-compose.override.worker-per-channel.yml mounts it in place of
# prometheus.yml). It is prometheus.yml with one difference: the job
# "worker" scrapes the three per-channel workers instead of the one worker,
# so the dashboard and the alert rules read them under the same job. Keep
# the rest in step with prometheus.yml; the per-channel scenario of make
# test-e2e checks that the three worker targets are up.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    static_configs:
      - targets: ["api:8081"]

  - job_name: relay
    static_configs:
      - targets: ["relay:8081"]

  - job_name: worker
    static_configs:
      - targets: ["worker-sms:8081", "worker-email:8081", "worker-push:8081"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8081"]

  - job_name: rabbitmq
    # Per-object endpoint; the default /metrics endpoint is aggregated and
    # has no per-queue series.
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]
